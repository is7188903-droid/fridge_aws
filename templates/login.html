<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 냉장고 관리</title>
<style>
body{font-family:sans-serif;background:#eef4f8;display:flex;justify-content:center;padding:60px 16px;margin:0}
.box{background:#fff;padding:32px 24px;border-radius:12px;width:100%;max-width:360px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:22px;text-align:center}
input,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:8px;font-size:15px}
input{border:1px solid #ccc}
button{border:0;background:#2b7de9;color:#fff;cursor:pointer}
.err{color:#d33;text-align:center}.ok{color:#1a8a3a;text-align:center}
a{display:block;text-align:center;margin-top:14px;color:#2b7de9}
</style>
</head>
<body>
<div class="box">
  <h1>🧊 냉장고 관리 로그인</h1>
  {% if msg %}<p class="ok">회원가입이 완료되었습니다. 로그인해 주세요.</p>{% endif %}
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input name="username" placeholder="아이디" required>
    <input name="password" type="password" placeholder="비밀번호" required>
    <button>로그인</button>
  </form>
  <a href="/signup">아직 회원이 아니신가요? 회원가입</a>
</div>
</body>
</html>
